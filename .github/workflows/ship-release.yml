name: Ship Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview tag without releasing (true/false)'
        required: false
        default: 'false'
        type: boolean
      tag:
        description: 'Explicit tag (default: computed from the current time)'
        required: false
        default: ''
        type: string

# Prevent concurrent releases — only one at a time.
concurrency:
  group: ship-release
  cancel-in-progress: false

jobs:
  ship:
    name: Create Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(scripts/compute-meso-tag.sh)
          fi
          # Validate before any use: the input reaches this script as an env
          # value (not expanded shell source), but a malformed tag must still
          # be rejected here rather than flowing into paths and git commands.
          if ! echo "$TAG" | grep -qE '^v[0-9]{4}\.[0-9]+\.[0-9]+-[0-9]+-meso$'; then
            echo "::error::Tag '$TAG' does not match the meso tag shape (vYYYY.M.D-<code>-meso)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "## Release tag: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

          # Sanity check: verify the tag decodes correctly
          scripts/compute-meso-tag.sh --verify "${TAG}" >> "$GITHUB_STEP_SUMMARY" 2>&1

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "### DRY RUN — tag will NOT be pushed" >> "$GITHUB_STEP_SUMMARY"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release notes for tag
        if: steps.tag.outputs.dry_run == 'false'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # The notes file is committed to main before dispatch, named exactly
          # releases/${TAG}.md; release.yml looks it up at checkout.
          if [[ ! -f "releases/${TAG}.md" ]]; then
            echo "::error::Release notes not found at releases/${TAG}.md — commit them to main before dispatch"
            exit 1
          fi
          echo "Release notes: releases/${TAG}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push release tag
        if: steps.tag.outputs.dry_run == 'false'
        env:
          GPG_RELEASE_KEY: ${{ secrets.GPG_RELEASE_KEY }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Tag the EXACT commit that carries the notes file. `git reset --hard
          # origin/main` is racy (local origin/main may lag the push), so instead
          # capture the notes-commit SHA before pushing and tag that. This
          # guarantees release.yml finds releases/\${TAG}.md at checkout.
          NOTES_SHA="$(git rev-parse HEAD)"
          git push origin "${NOTES_SHA}:main"

          # Import the dedicated release-signing key (Option B from the GPG
          # decision checkpoint). No passphrase — CI-only, revocable without
          # touching the primary identity. GitHub marks the tag "Verified" when
          # the public half is registered on the account.
          echo "${GPG_RELEASE_KEY}" | gpg --batch --import 2>&1
          SIGNING_KEY=$(gpg --list-keys --keyid-format long meso-release-bot 2>&1 | awk '/^pub/{print $2}' | cut -d/ -f2)
          echo "GPG signing key: ${SIGNING_KEY}" >> "$GITHUB_STEP_SUMMARY"
          git config user.signingkey "${SIGNING_KEY}"

          # Signed annotated tag — GitHub shows "Verified" badge.
          git tag -s -a "${TAG}" "${NOTES_SHA}" -m "${TAG}"
          git push origin "${TAG}"
          echo "### Tag pushed: ${TAG} @ ${NOTES_SHA} (GPG signed)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build & Release Binaries
    needs: ship
    if: needs.ship.outputs.dry_run == 'false'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.ship.outputs.tag_name }}
    # CRITICAL: pass all caller secrets to the called workflow. Without
    # this, the reusable workflow (release.yml) sees secrets.* as empty —
    # which is why every ship-release run has failed the VirusTotal step
    # with "VIRUS_TOTAL secret not set" and the verdict-post 404'd
    # (no report file to attach). `inherit` passes every secret the
    # caller has: VIRUS_TOTAL, GITHUB_TOKEN, BUILD_NOTIFY, etc.
    secrets: inherit
    permissions:
      contents: write
