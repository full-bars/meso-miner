name: Ship Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview tag without releasing (true/false)'
        required: false
        default: 'false'
        type: boolean

# Prevent concurrent releases — only one at a time.
concurrency:
  group: ship-release
  cancel-in-progress: false

jobs:
  ship:
    name: Create Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release tag
        id: tag
        run: |
          TAG=$(scripts/compute-meso-tag.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "## Release tag: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

          # Sanity check: verify the tag decodes correctly
          scripts/compute-meso-tag.sh --verify "${TAG}" >> "$GITHUB_STEP_SUMMARY" 2>&1

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "### DRY RUN — tag will NOT be pushed" >> "$GITHUB_STEP_SUMMARY"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release notes for tag
        if: steps.tag.outputs.dry_run == 'false'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTE_FILE="releases/v3.23.0-fix.30.8.md"
          if [[ ! -f "$NOTE_FILE" ]]; then
            echo "::error::Release notes not found at ${NOTE_FILE}"
            exit 1
          fi
          # The notes file uses the 3.23-fix historical name, but release.yml
          # looks up releases/\${TAG}.md. Copy it to the tag-named path so the
          # release body uses the meso-customized notes, not auto-generated.
          cp "$NOTE_FILE" "releases/${TAG}.md"
          git add "releases/${TAG}.md"
          git config user.name "full-bars"
          git config user.email "45684698+full-bars@users.noreply.github.com"
          git commit -m "docs: release notes for \${TAG}" || echo "notes already committed"
          git push origin HEAD:main
          echo "Release notes staged at releases/\${TAG}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push release tag
        if: steps.tag.outputs.dry_run == 'false'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Re-point at the freshly-pushed main (with the notes commit).
          git fetch origin main
          git reset --hard origin/main
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "### Tag pushed: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build & Release Binaries
    needs: ship
    if: needs.ship.outputs.dry_run == 'false'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.ship.outputs.tag_name }}
    permissions:
      contents: write
